name: rebuild-snapshot

# Refreshes data/board.json from a live board, on demand only.
#
# There is no shared board any more: the hosted site was retired on 2026-09-01,
# so the twice-daily cron that used to run this had nothing to copy and failed
# every time. The schedule is gone. Run it by hand from the Actions tab with
# HFTR_BASE_URL pointing at a board you run.
#
# If the API is empty or unreachable, build_snapshot.py exits 1 and this job
# goes red WITHOUT committing - the previous snapshot stays live.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull live board into data/board.json
        run: python3 scripts/build_snapshot.py
      - name: Commit only if the snapshot changed
        run: |
          git config user.name "hftr-snapshot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/board.json
          if git diff --staged --quiet; then
            echo "snapshot unchanged"
            exit 0
          fi
          git commit -m "chore: refresh snapshot after ingest window"
          git push
